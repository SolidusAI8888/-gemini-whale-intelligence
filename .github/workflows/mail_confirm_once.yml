name: One-time report mail confirmation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  confirm:
    if: contains(github.event.head_commit.message, '[mail-confirm-fast]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PATH: data/whale.db
      REPORT_DIR: data/reports
      LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '200' }}
      SCAN_START_DATE: ${{ vars.SCAN_START_DATE || '2026-01-01' }}
      SEND_EMAIL: 'true'
      DRY_RUN: 'false'
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || secrets.EMAIL_PROVIDER || 'smtp' }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.mail.me.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS || 'true' }}
      SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME || 'Gemini Whale Intelligence' }}
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Restore latest production state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/whale.db
            data/last_email_date.txt
          key: whale-mail-confirm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            whale-state-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build current report from persisted DB and send confirmation
        run: |
          python - <<'PY'
          from datetime import datetime

          from app.config import settings
          from app.db import (
              fetch_core_trades_by_action,
              fetch_institutional_13f_holdings,
              fetch_market_snapshots,
              fetch_noncore_recent_trades,
              fetch_oge_action_summary,
              fetch_oge_executive_trades,
              fetch_political_action_summary,
              fetch_top_scores,
              fetch_trade_evidence_for_tickers,
              fetch_trades_since,
              fetch_trump_oge_trades,
          )
          from app.domain.trade_classification import primary_transactions
          from app.main import _row_to_dict
          from app.reports.html_report import build_html_report, save_report
          from app.reports.mailer import send_report
          from app.reports.quality_gate import validate_key_political_visibility, validate_report_html
          from app.reports.v40_report import apply_v40_report_layout

          all_window_rows = [_row_to_dict(r) for r in fetch_trades_since(settings.scan_start_date, limit=50000)]
          if not all_window_rows:
              raise RuntimeError("No persisted production disclosures restored; refusing to send empty confirmation report.")

          recent_trades = list(primary_transactions(all_window_rows))
          top_scores = [_row_to_dict(r) for r in fetch_top_scores(limit=50)]
          political_summary = [_row_to_dict(r) for r in fetch_political_action_summary()]
          market_context = [_row_to_dict(r) for r in fetch_market_snapshots(limit=50)]
          trump_oge_trades = [_row_to_dict(r) for r in fetch_trump_oge_trades(limit=500)]
          oge_executive_trades = [_row_to_dict(r) for r in fetch_oge_executive_trades(limit=800)]
          oge_summary = [_row_to_dict(r) for r in fetch_oge_action_summary()]
          institutional_13f_holdings = [_row_to_dict(r) for r in fetch_institutional_13f_holdings("1900-01-01", limit=5000)]

          buy_signal_tickers = [str(r.get("ticker") or "") for r in top_scores if float(r.get("buy_amount") or 0) > 0]
          sell_signal_tickers = sorted({
              str(r.get("ticker") or "")
              for r in top_scores
              if float(r.get("sell_amount") or 0) > 0
          })
          buy_evidence = primary_transactions([
              _row_to_dict(r) for r in fetch_trade_evidence_for_tickers(
                  buy_signal_tickers, "BUY", settings.lookback_days, limit=160
              )
          ])
          sell_evidence = primary_transactions([
              _row_to_dict(r) for r in fetch_trade_evidence_for_tickers(
                  sell_signal_tickers, "SELL", settings.lookback_days, limit=5000
              )
          ])
          core_buy_trades = primary_transactions([
              _row_to_dict(r) for r in fetch_core_trades_by_action(
                  "BUY", settings.lookback_days, limit=120
              )
          ])
          core_sell_trades = primary_transactions([
              _row_to_dict(r) for r in fetch_core_trades_by_action(
                  "SELL", settings.lookback_days, limit=1000
              )
          ])
          noncore_trades = [
              _row_to_dict(r) for r in fetch_noncore_recent_trades(
                  settings.lookback_days, limit=100
              )
          ]

          html = build_html_report(
              top_scores,
              recent_trades,
              ai_analysis="",
              new_trade_count=0,
              political_summary=political_summary,
              market_context=market_context,
              buy_evidence=buy_evidence,
              sell_evidence=sell_evidence,
              core_buy_trades=core_buy_trades,
              core_sell_trades=core_sell_trades,
              noncore_trades=noncore_trades,
              trump_oge_trades=trump_oge_trades,
              oge_executive_trades=oge_executive_trades,
              oge_summary=oge_summary,
              institutional_13f_holdings=institutional_13f_holdings,
              institutional_13f_status=[],
              new_since=None,
              baseline_trade_count=len(all_window_rows),
              wis_rankings={},
          )
          html = apply_v40_report_layout(html, recent_trades, new_since=None)
          validate_report_html(html)
          validate_key_political_visibility(html, recent_trades)
          path = save_report(html)

          subject = f"【版式确认】Gemini-美股聪明钱_政商巨鲸行动追踪 {datetime.now().strftime('%Y-%m-%d %H:%M')}"
          if not send_report(subject, html):
              raise RuntimeError("send_report returned False")
          print(f"CONFIRMATION_EMAIL_SENT report={path}")
          PY
