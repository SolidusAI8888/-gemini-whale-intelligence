name: Development Report Preview

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to test
        required: true
        default: feature/v40-foundation
        type: string
      send_email:
        description: Send the generated preview by email
        required: true
        default: true
        type: boolean
      enable_gemini:
        description: Enable Gemini analysis
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: development-report-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Generate development report
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_PATH: data/dev-preview-whale.db
      REPORT_DIR: data/dev-preview-reports
      DRY_RUN: "false"
      FORCE_SEND_EMAIL: ${{ inputs.send_email }}
      SEND_EMAIL: ${{ inputs.send_email }}
      ENABLE_GEMINI: ${{ inputs.enable_gemini }}

      # Preview must use the same report/scanning policy as production.
      LOOKBACK_DAYS: "200"
      SCAN_START_DATE: "2026-01-01"
      MAX_COMPANIES: "0"
      MIN_OPPORTUNITY_SCORE: "55"
      ENABLE_POLITICAL_TRADES: "true"
      POLITICAL_PROVIDER: "auto"
      POLITICAL_UNIVERSE_SCOPE: "all"
      POLITICAL_MAX_FILINGS: "300"
      FMP_CONGRESSIONAL_ENABLED: "false"

      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

      EMAIL_PROVIDER: smtp
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_HOST: smtp.mail.me.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_STARTTLS: "true"
      SMTP_FROM_NAME: "Gemini Whale Intelligence — Development Preview"

      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

      OGE_TRUMP_REPORT_URLS: ${{ secrets.OGE_TRUMP_REPORT_URLS }}
      OGE_CABINET_REPORTS: ${{ secrets.OGE_CABINET_REPORTS }}
      OGE_SEED_CABINET_REPORTS: ${{ secrets.OGE_SEED_CABINET_REPORTS }}

    steps:
      - name: Check out selected development ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Record checked-out source revision
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "REPORT_BUILD_SHA=$checked_out_sha" >> "$GITHUB_ENV"
          echo "Checked-out source ref: ${{ inputs.source_ref }}"
          echo "Checked-out source SHA: $checked_out_sha"

      - name: Restore latest production scan database as regression baseline
        id: restore_production_state
        uses: actions/cache/restore@v4
        with:
          # Cache versions include the path list. This must exactly match
          # daily_scan.yml's cache/save paths.
          path: |
            data/whale.db
            data/last_email_date.txt
          key: preview-production-baseline-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            whale-state-${{ runner.os }}-

      - name: Seed isolated preview database from production baseline
        run: |
          mkdir -p data
          if [ -f data/whale.db ]; then
            cp data/whale.db data/dev-preview-whale.db
            echo "Preview baseline copied from production whale.db: $(du -h data/whale.db | cut -f1)"
            echo "PREVIEW_BASELINE=production-cache" >> "$GITHUB_ENV"
          else
            rm -f data/dev-preview-whale.db
            echo "ERROR: production whale.db cache was not restored."
            echo "A regression preview without the production baseline is not a valid comparison; failing closed."
            echo "PREVIEW_BASELINE=missing-production-cache" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run tests
        run: python -m pytest -q

      - name: Show regression-comparison policy
        run: |
          echo "PREVIEW_BASELINE=${PREVIEW_BASELINE:-unknown}"
          echo "LOOKBACK_DAYS=${LOOKBACK_DAYS}"
          echo "SCAN_START_DATE=${SCAN_START_DATE}"
          echo "POLITICAL_UNIVERSE_SCOPE=${POLITICAL_UNIVERSE_SCOPE}"
          echo "POLITICAL_MAX_FILINGS=${POLITICAL_MAX_FILINGS}"

      - name: Verify SMTP configuration without exposing secrets
        if: ${{ inputs.send_email }}
        run: |
          python - <<'PY'
          import os
          required = ["EMAIL_FROM", "EMAIL_TO", "SMTP_USERNAME", "SMTP_PASSWORD"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit("Missing required email secrets: " + ", ".join(missing))
          print("SMTP endpoint:", os.environ["SMTP_HOST"], os.environ["SMTP_PORT"], "STARTTLS=", os.environ["SMTP_STARTTLS"])
          PY

      - name: Generate preview report
        run: python -m app.main

      - name: Export preview website data
        if: success()
        run: python -m app.site_data

      - name: Verify large political BUYs reached final active radar
        if: success()
        run: |
          python - <<'PY'
          from __future__ import annotations
          import os
          import re
          import sqlite3
          from pathlib import Path
          from app.domain.trade_classification import is_primary_transaction
          from app.reports.quality_gate import validate_report_html

          db = Path(os.environ.get("DATABASE_PATH", "data/dev-preview-whale.db"))
          report_dir = Path(os.environ.get("REPORT_DIR", "data/dev-preview-reports"))
          reports = sorted(report_dir.glob("*.html"), key=lambda p: p.stat().st_mtime)
          if not reports:
              raise SystemExit("V46 merge gate: no generated HTML report found")
          report = reports[-1]
          html = report.read_text(encoding="utf-8")
          validate_report_html(html)

          match = re.search(r'<section id="v40-active-buy-radar">(.*?)</section>', html, re.I | re.S)
          active = match.group(1) if match else ""
          if not active:
              raise SystemExit("V46 merge gate: active-buy radar section missing")

          tickers = ("UBER", "MSFT", "INTC")
          failures = []
          conn = sqlite3.connect(db)
          conn.row_factory = sqlite3.Row
          try:
              for ticker in tickers:
                  rows = conn.execute(
                      """
                      SELECT * FROM trades
                      WHERE ticker = ?
                        AND (source LIKE 'POLITICAL%' OR whale_category LIKE 'Political%')
                        AND action = 'BUY'
                        AND COALESCE(trade_date, filing_date, '') >= ?
                      """,
                      (ticker, os.environ.get("SCAN_START_DATE", "2026-01-01")),
                  ).fetchall()
                  accepted = [dict(r) for r in rows if is_primary_transaction(dict(r))]
                  largest = max((float(r.get("amount_usd") or 0) for r in accepted), default=0.0)
                  visible = bool(re.search(rf"<b>\s*{ticker}\s*</b>", active, re.I))
                  print(f"V46 final-HTML audit ticker={ticker} accepted_buy_rows={len(accepted)} largest=${largest:,.0f} visible={visible}")
                  if largest >= 250_000 and not visible:
                      failures.append(f"{ticker}: largest accepted political BUY ${largest:,.0f} missing from active radar")
          finally:
              conn.close()

          if failures:
              raise SystemExit("V46 political visibility merge gate failed: " + "; ".join(failures))
          print(f"V46 political visibility merge gate passed for {report}")
          PY

      - name: Audit historical political regression signals
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations
          import os
          import re
          import sqlite3
          from pathlib import Path
          from app.domain.trade_classification import is_primary_transaction

          db = Path(os.environ.get("DATABASE_PATH", "data/dev-preview-whale.db"))
          report_dir = Path(os.environ.get("REPORT_DIR", "data/dev-preview-reports"))
          reports = sorted(report_dir.glob("*.html"), key=lambda p: p.stat().st_mtime) if report_dir.exists() else []
          html = reports[-1].read_text(encoding="utf-8") if reports else ""
          active_match = re.search(r'<section id="v40-active-buy-radar">(.*?)</section>', html, re.I | re.S)
          active = active_match.group(1) if active_match else ""

          tickers = ("UBER", "MSFT", "INTC")
          lines = ["## V46 political regression audit", ""]
          if not db.exists():
              lines.append(f"- Database not found: `{db}`")
          else:
              conn = sqlite3.connect(db)
              conn.row_factory = sqlite3.Row
              for ticker in tickers:
                  rows = conn.execute(
                      """
                      SELECT ticker, action, amount_usd, whale_name, trade_date, filing_date,
                             source, transaction_code, raw_json
                      FROM trades
                      WHERE ticker = ? AND source LIKE 'POLITICAL%'
                      ORDER BY COALESCE(trade_date, filing_date) DESC, amount_usd DESC
                      """,
                      (ticker,),
                  ).fetchall()
                  accepted = [r for r in rows if is_primary_transaction(dict(r))]
                  accepted_buys = [r for r in accepted if str(r["action"] or "").upper() == "BUY"]
                  largest_buy = max((float(r["amount_usd"] or 0) for r in accepted_buys), default=0.0)
                  visible = bool(re.search(rf"<b>\s*{ticker}\s*</b>", active, re.I))
                  lines.append(f"### {ticker}")
                  lines.append(f"- Political rows in preview DB: **{len(rows)}**")
                  lines.append(f"- Rows accepted by current signal policy: **{len(accepted)}**")
                  lines.append(f"- Largest accepted BUY: **${largest_buy:,.0f}**")
                  lines.append(f"- Visible in final active-buy radar: **{'YES' if visible else 'NO'}**")
                  if rows:
                      lines.append("")
                      lines.append("|Accepted|Action|Amount|Actor|Trade date|Source|Code|")
                      lines.append("|---|---|---:|---|---|---|---|")
                      for row in rows[:20]:
                          ok = "YES" if is_primary_transaction(dict(row)) else "NO"
                          amount = float(row["amount_usd"] or 0)
                          lines.append(
                              f"|{ok}|{row['action'] or '-'}|${amount:,.0f}|{row['whale_name'] or '-'}|"
                              f"{row['trade_date'] or row['filing_date'] or '-'}|{row['source'] or '-'}|{row['transaction_code'] or '-'}|"
                          )
                  lines.append("")
              conn.close()
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary)
          PY

      - name: Upload generated report and database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-report-${{ github.run_number }}
          path: |
            data/dev-preview-reports/**
            data/dev-preview-whale.db
            site/public/data/site-data.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Development report preview"
            echo "- Source ref: \`${{ inputs.source_ref }}\`"
            echo "- Checked-out source SHA: \`${REPORT_BUILD_SHA:-unknown}\`"
            echo "- Regression baseline: \`${PREVIEW_BASELINE:-unknown}\`"
            echo "- LOOKBACK_DAYS: \`${LOOKBACK_DAYS}\`"
            echo "- SCAN_START_DATE: \`${SCAN_START_DATE}\`"
            echo "- POLITICAL_UNIVERSE_SCOPE: \`${POLITICAL_UNIVERSE_SCOPE}\`"
            echo "- POLITICAL_MAX_FILINGS: \`${POLITICAL_MAX_FILINGS}\`"
            echo "- Email requested: \`${{ inputs.send_email }}\`"
            echo "- Gemini enabled: \`${{ inputs.enable_gemini }}\`"
            echo "- SMTP endpoint: \`smtp.mail.me.com:587\` with STARTTLS"
            echo "- Production 08:00 workflow was not modified."
            echo "- Preview requires and uses a COPY of the latest production database cache; it fails closed if that baseline cannot be restored."
            echo "- V46 merge gate fails if a >=$250K accepted UBER/MSFT/INTC political BUY exists in the baseline but is absent from the final active-buy radar."
          } >> "$GITHUB_STEP_SUMMARY"
